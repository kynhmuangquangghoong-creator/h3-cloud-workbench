name: Build and Push H3 Cloud Workbench Image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "runner/universal_worker.py"
      - ".github/workflows/build-h3-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/h3-cloud-workbench:latest
            ghcr.io/${{ github.repository_owner }}/h3-cloud-workbench:${{ github.sha }}

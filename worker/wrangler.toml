name = "gpu-workbench"
main = "src/worker.js"
compatibility_date = "2026-11-01"
account_id = "a87f9319ee61c232f1b24da398a4f17b"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "console-db"
database_id = "81214707-5610-42b4-a90f-35b143f20fe4"

[[r2_buckets]]
binding = "GPU_JOBS"
bucket_name = "gpu-jobs"

[vars]
RUNPOD_IMAGE_NAME = "ghcr.io/kynhmuangquangghoong-creator/h3-cloud-workbench:latest"
POD_MAX_RUNTIME_MIN = "90"
POD_STALE_HEARTBEAT_MIN = "15"

[triggers]
crons = ["*/10 * * * *"]
